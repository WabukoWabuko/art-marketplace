version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: art_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - art_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: 0
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: art_marketplace
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - ./backend:/app
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      - db
    networks:
      - art_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - art_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - art_network

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  art_network:
    driver: bridge